[project]
name = "proyecto-final-orders"
version = "0.1.0"
description = ""
authors = [
    {name = "Nathan",email = "joseph.garcia@axity.com"}
]
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "fastapi (>=0.142.2,<0.143.0)",
    "uvicorn[standard] (>=0.54.0,<0.55.0)",
    "sqlalchemy (>=2.1.3,<3.0.0)",
    "alembic (>=1.20.0,<2.0.0)",
    "pydantic (>=2.13.5,<3.0.0)",
    "pydantic-settings (>=2.15.0,<3.0.0)",
    "pyjwt (>=2.15.1,<3.0.0)",
    "passlib (>=1.7.4,<2.0.0)",
    "python-multipart (>=0.0.32,<0.0.33)"
]

[tool.poetry]
packages = [{include = "proyecto_final_orders", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.mypy]
strict = true

[tool.pytest.ini_options]
pythonpath = ["src"]
[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "mypy (>=2.4.0,<3.0.0)",
    "ruff (>=0.16.10,<0.17.0)",
    "black (>=26.10.0,<27.0.0)",
    "isort (>=9.0.2,<10.0.0)",
    "pre-commit (>=4.6.2,<5.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "pip-audit (>=2.10.1,<3.0.0)",
    "safety (>=3.8.1,<4.0.0)"
]
